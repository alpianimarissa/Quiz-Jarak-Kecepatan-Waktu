<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Interaktif JKW - Kelas 6 SD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        h1, h2, h3, .font-heading {
            font-family: 'Fredoka', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 pb-12">

    <!-- Header Navigation -->
    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-indigo-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🏆</span>
                <div>
                    <h1 class="text-xl font-bold text-indigo-600">Kuis Jarak, Kecepatan & Waktu</h1>
                    <p class="text-xs text-slate-500">30 Soal Interaktif (15 Dasar & 15 Penalaran)</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5">
                    <span>Terjawab:</span>
                    <span id="answered-count" class="text-sm">0/30</span>
                </div>
                <button onclick="resetQuizProgress()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-semibold px-3 py-1.5 rounded-xl transition-all">
                    🔄 Reset Progress
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

        <!-- Left Sidebar / Navigation Panel -->
        <aside class="lg:col-span-1 bg-white p-5 rounded-3xl shadow-sm border border-indigo-50 space-y-4 h-fit">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-slate-800 text-base">Navigasi Soal</h2>
                <span class="text-xs font-medium text-slate-400">1 - 30</span>
            </div>

            <div class="text-xs flex items-center justify-between gap-2 border-b pb-3 text-slate-500">
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span> Benar</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span> Salah</span>
                <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-slate-200 inline-block"></span> Belum</span>
            </div>

            <!-- Question Numbers Grid -->
            <div id="nav-grid" class="grid grid-cols-5 gap-2 max-h-72 overflow-y-auto p-1">
                <!-- Injected via JS -->
            </div>

            <div class="pt-2">
                <button onclick="finishQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow-md transition-all text-sm">
                    🏁 Selesaikan & Lihat Nilai
                </button>
            </div>
        </aside>

        <!-- Right Main Question Area -->
        <section class="lg:col-span-3 space-y-6">
            
            <!-- Question Card -->
            <div id="question-card" class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm border border-indigo-50 space-y-6">
                
                <div class="flex justify-between items-center border-b pb-4">
                    <div class="flex items-center gap-2">
                        <span id="question-badge" class="bg-indigo-100 text-indigo-700 font-bold px-3 py-1 rounded-full text-xs">
                            Soal 1
                        </span>
                        <span id="question-category" class="bg-slate-100 text-slate-600 font-semibold px-3 py-1 rounded-full text-xs">
                            Dasar
                        </span>
                    </div>
                    <span class="text-xs text-emerald-600 font-semibold flex items-center gap-1">
                        🔒 Otomatis Tersimpan
                    </span>
                </div>

                <!-- Question Text -->
                <p id="question-text" class="text-slate-800 font-semibold text-base sm:text-lg leading-relaxed">
                    Memuat pertanyaan...
                </p>

                <!-- Options Grid -->
                <div id="options-container" class="space-y-3">
                    <!-- Injected via JS -->
                </div>

                <!-- Immediate Feedback Banner -->
                <div id="feedback-box" class="hidden p-4 rounded-2xl border text-sm space-y-1">
                    <!-- Injected via JS -->
                </div>

                <!-- Bottom Question Controls -->
                <div class="flex justify-between items-center pt-4 border-t">
                    <button onclick="prevQuestion()" id="btn-prev" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2 rounded-xl text-sm transition-all">
                        ← Sebelumnya
                    </button>
                    <button onclick="nextQuestion()" id="btn-next" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2 rounded-xl text-sm shadow transition-all">
                        Berikutnya →
                    </button>
                </div>

            </div>

        </section>

    </main>

    <!-- Modal Score Result -->
    <div id="modal-result" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl text-center space-y-5">
            <div class="text-6xl">🎉</div>
            <h3 class="text-2xl font-bold text-slate-800">Hasil Kuis Kamu!</h3>
            
            <div class="bg-indigo-50 rounded-2xl p-4 grid grid-cols-3 gap-2">
                <div>
                    <span class="text-xs text-slate-500 block">Nilai</span>
                    <span id="score-final" class="text-2xl font-black text-indigo-600">0</span>
                </div>
                <div>
                    <span class="text-xs text-slate-500 block">Benar</span>
                    <span id="score-correct" class="text-2xl font-black text-emerald-600">0</span>
                </div>
                <div>
                    <span class="text-xs text-slate-500 block">Salah</span>
                    <span id="score-wrong" class="text-2xl font-black text-rose-600">0</span>
                </div>
            </div>

            <p id="score-evaluation" class="text-sm text-slate-600 font-medium">
                Pesan evaluasi di sini.
            </p>

            <div class="flex gap-2">
                <button onclick="closeModalResult()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl text-sm">
                    Tinjau Kuis
                </button>
                <button onclick="resetQuizProgress()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-sm shadow">
                    Ulangi Kuis 🔄
                </button>
            </div>
        </div>
    </div>

    <script>

        const quizData = [

        let currentIndex = 0;
        let userAnswers = {}; // { qIndex: selectedOptionIndex }

        const STORAGE_KEY = 'jkw_quiz_user_answers_v1';

        // Load progress from LocalStorage
        function loadProgress() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    userAnswers = JSON.parse(saved);
                } catch (e) {
                    userAnswers = {};
                }
            }
        }

        // Save progress to LocalStorage
        function saveProgress() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(userAnswers));
            updateHeaderProgress();
        }

        // Reset Progress
        function resetQuizProgress() {
            if (confirm("Apakah kamu yakin ingin mengulang seluruh kuis dari awal? Jawabanmu akan dihapus.")) {
                localStorage.removeItem(STORAGE_KEY);
                userAnswers = {};
                currentIndex = 0;
                renderNavGrid();
                renderQuestion(currentIndex);
                updateHeaderProgress();
                closeModalResult();
            }
        }

        // Update Header Progress Text
        function updateHeaderProgress() {
            const count = Object.keys(userAnswers).length;
            document.getElementById('answered-count').innerText = `${count}/30`;
        }

        // Render Nav Grid
        function renderNavGrid() {
            const grid = document.getElementById('nav-grid');
            let html = '';
            quizData.forEach((q, idx) => {
                let statusClass = "bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200";
                
                if (userAnswers.hasOwnProperty(idx)) {
                    const isCorrect = userAnswers[idx] === q.answer;
                    if (isCorrect) {
                        statusClass = "bg-emerald-500 text-white font-bold border-emerald-600";
                    } else {
                        statusClass = "bg-rose-500 text-white font-bold border-rose-600";
                    }
                }

                if (idx === currentIndex) {
                    statusClass += " ring-2 ring-indigo-600 ring-offset-1";
                }

                html += `
                    <button onclick="jumpToQuestion(${idx})" class="h-9 font-semibold text-xs rounded-xl border transition-all flex items-center justify-center ${statusClass}">
                        ${idx + 1}
                    </button>
                `;
            });
            grid.innerHTML = html;
        }

        // Jump to specific question
        function jumpToQuestion(idx) {
            currentIndex = idx;
            renderQuestion(currentIndex);
            renderNavGrid();
        }

        // Render Current Question
        function renderQuestion(idx) {
            const q = quizData[idx];
            document.getElementById('question-badge').innerText = `Soal ${idx + 1} dari 30`;
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-text').innerText = q.question;

            const optionsContainer = document.getElementById('options-container');
            const feedbackBox = document.getElementById('feedback-box');
            
            const isAnswered = userAnswers.hasOwnProperty(idx);
            const selectedOpt = userAnswers[idx];

            let html = '';
            const labels = ['A', 'B', 'C', 'D'];

            q.options.forEach((opt, oIdx) => {
                let btnStyle = "bg-slate-50 border-slate-200 hover:border-indigo-300 text-slate-700";
                let badgeStyle = "bg-slate-200 text-slate-700";

                if (isAnswered) {
                    if (oIdx === q.answer) {
                        btnStyle = "bg-emerald-50 border-emerald-400 text-emerald-900 font-semibold ring-1 ring-emerald-400";
                        badgeStyle = "bg-emerald-600 text-white";
                    } else if (oIdx === selectedOpt) {
                        btnStyle = "bg-rose-50 border-rose-400 text-rose-900 font-semibold ring-1 ring-rose-400";
                        badgeStyle = "bg-rose-600 text-white";
                    } else {
                        btnStyle = "bg-slate-50 border-slate-100 text-slate-400 opacity-60";
                        badgeStyle = "bg-slate-100 text-slate-400";
                    }
                }

                html += `
                    <button onclick="selectOption(${idx}, ${oIdx})" ${isAnswered ? 'disabled' : ''} class="w-full text-left p-4 rounded-2xl border transition-all flex items-start space-x-3 ${btnStyle}">
                        <span class="w-7 h-7 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${badgeStyle}">
                            ${labels[oIdx]}
                        </span>
                        <span class="text-sm leading-relaxed">${opt}</span>
                    </button>
                `;
            });

            optionsContainer.innerHTML = html;

            // Feedback Box
            if (isAnswered) {
                feedbackBox.classList.remove('hidden');
                const isCorrect = selectedOpt === q.answer;
                if (isCorrect) {
                    feedbackBox.className = "p-4 rounded-2xl border text-sm space-y-1 bg-emerald-50 border-emerald-200 text-emerald-900";
                    feedbackBox.innerHTML = `
                        <p class="font-bold flex items-center gap-1.5 text-emerald-800">
                            <span>✅ Jawaban Kamu Benar!</span>
                        </p>
                        <p class="text-xs text-emerald-700">${q.explanation}</p>
                    `;
                } else {
                    feedbackBox.className = "p-4 rounded-2xl border text-sm space-y-1 bg-rose-50 border-rose-200 text-rose-900";
                    feedbackBox.innerHTML = `
                        <p class="font-bold flex items-center gap-1.5 text-rose-800">
                            <span>❌ Jawaban Kamu Belum Tepat</span>
                        </p>
                        <p class="text-xs text-rose-700">Pembahasan: ${q.explanation}</p>
                    `;
                }
            } else {
                feedbackBox.classList.add('hidden');
            }

            // Prev / Next button state
            document.getElementById('btn-prev').disabled = idx === 0;
            document.getElementById('btn-prev').classList.toggle('opacity-50', idx === 0);

            if (idx === quizData.length - 1) {
                document.getElementById('btn-next').innerText = "Selesai 🏁";
            } else {
                document.getElementById('btn-next').innerText = "Berikutnya →";
            }
        }

        // Handle Option Selection
        function selectOption(qIdx, optIdx) {
            if (userAnswers.hasOwnProperty(qIdx)) return;
            
            userAnswers[qIdx] = optIdx;
            saveProgress();
            renderQuestion(qIdx);
            renderNavGrid();
        }

        function nextQuestion() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion(currentIndex);
                renderNavGrid();
            } else {
                finishQuiz();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion(currentIndex);
                renderNavGrid();
            }
        }

        // Calculate and Show Quiz Results
        function finishQuiz() {
            const answeredTotal = Object.keys(userAnswers).length;
            
            if (answeredTotal < quizData.length) {
                if (!confirm(`Kamu baru menjawab ${answeredTotal} dari 30 soal. Apakah yakin ingin melihat hasil sekarang?`)) {
                    return;
                }
            }

            let correctCount = 0;
            quizData.forEach((q, idx) => {
                if (userAnswers[idx] === q.answer) {
                    correctCount++;
                }
            });

            const wrongCount = answeredTotal - correctCount;
            const finalScore = Math.round((correctCount / quizData.length) * 100);

            document.getElementById('score-final').innerText = finalScore;
            document.getElementById('score-correct').innerText = correctCount;
            document.getElementById('score-wrong').innerText = wrongCount;

            let evalMsg = "";
            if (finalScore >= 90) {
                evalMsg = "Luar Biasa! 🌟 Pemahaman kamu mengenai Jarak, Kecepatan, dan Waktu sudah sangat matang!";
            } else if (finalScore >= 70) {
                evalMsg = "Bagus Sekali! 👍 Kamu sudah menguasai sebagian besar materi dan penalaran dengan baik.";
            } else if (finalScore >= 50) {
                evalMsg = "Cukup Baik! 🙂 Cobalah untuk meninjau kembali pembahasan soal yang masih salah.";
            } else {
                evalMsg = "Jangan berkecil hati! 💪 Pelajari kembali materi dasar dan latihan soal lalu coba lagi kuis ini!";
            }

            document.getElementById('score-evaluation').innerText = evalMsg;
            document.getElementById('modal-result').classList.remove('hidden');
        }

        function closeModalResult() {
            document.getElementById('modal-result').classList.add('hidden');
        }

        // Initialize App
        window.onload = function() {
            loadProgress();
            renderNavGrid();
            renderQuestion(currentIndex);
            updateHeaderProgress();
        };
    </script>
</body>
</html>
